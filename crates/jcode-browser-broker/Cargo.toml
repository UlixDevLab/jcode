[package]
name = "jcode-browser-broker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Provenance and domain types for the trusted-local browser broker (M1)."

[lib]
name = "jcode_browser_broker"
path = "src/lib.rs"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
